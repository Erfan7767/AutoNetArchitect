name: Documentation Build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs.yml"
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built documentation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/requirements-docs.txt
            requirements-dev.txt
      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements-docs.txt
      - name: Verify local documentation links
        run: python scripts/check_docs_links.py
      - name: Build strict MkDocs site
        run: python -m mkdocs build --strict --config-file docs/mkdocs.yml
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: deploy-docs
    needs: build
    if: ${{ inputs.publish == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
