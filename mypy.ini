[mypy]
python_version = 3.11
files = autonetarchitect
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# The compatibility namespace imports historical top-level implementation
# packages. They are covered by the custom regression suite and migrated to
# strict typing incrementally; skipping their bodies avoids a false claim that
# the complete legacy tree is already strict-typed.
follow_imports = skip
exclude = (^|/)(build|dist|\.venv|tests|scripts)(/|$)

[mypy-netmiko.*]
ignore_missing_imports = true

[mypy-paramiko.*]
ignore_missing_imports = true

[mypy-nornir.*]
ignore_missing_imports = true

[mypy-napalm.*]
ignore_missing_imports = true

[mypy-streamlit.*]
ignore_missing_imports = true

[mypy-reportlab.*]
ignore_missing_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-docx.*]
ignore_missing_imports = true

[mypy-graphviz.*]
ignore_missing_imports = true

[mypy-textfsm.*]
ignore_missing_imports = true

[mypy-tests.*]
disallow_untyped_defs = false
disallow_untyped_calls = false
