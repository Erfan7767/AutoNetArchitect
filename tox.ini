[tox]
min_version = 4.18
env_list = py311, py312, integration, e2e, lint, typecheck, security, docs, build
skip_missing_interpreters = true
isolated_build = true
skipsdist = false

[testenv]
deps =
    .[dev]
setenv =
    PYTHONPATH = {tox_root}
    AUTONET_RUNTIME_MODE = test
commands =
    pytest tests/unit/ tests/ci/ -v --tb=short --cov=autonetarchitect --cov-config=coverage_config/.coveragerc --cov-report=term-missing {posargs}

[testenv:py311]
base_python = python3.11

[testenv:py312]
base_python = python3.12

[testenv:integration]
deps =
    .[all]
commands =
    pytest tests/integration/ -v --tb=short {posargs}

[testenv:e2e]
deps =
    .[all]
commands =
    pytest tests/e2e/ -v --tb=short --timeout=300 {posargs}

[testenv:lint]
deps =
    ruff>=0.6,<1
commands =
    ruff check . --config pyproject.toml
    ruff format --check . --config pyproject.toml

[testenv:typecheck]
deps =
    mypy>=1.11,<2
    pydantic>=2.5,<3
    types-PyYAML
    types-toml
commands =
    mypy autonetarchitect/ --config-file mypy.ini

[testenv:security]
allowlist_externals =
    bash
deps =
    bandit>=1.7,<2
    pip-audit>=2.7,<3
    safety>=3,<4
setenv =
    PYTHONPATH = {tox_root}
    AUTONET_RUNTIME_MODE = test
    AUTONET_SECURITY_PYTHON = {envpython}
commands =
    bash scripts/run_security_scan.sh

[testenv:docs]
deps =
    .[docs]
commands =
    python scripts/check_docs_links.py
    mkdocs build --strict --config-file docs/mkdocs.yml

[testenv:build]
deps =
    build>=1.2,<2
    twine>=5,<7
commands =
    python -m build
    twine check dist/*
