default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^data/template_registry\.json$
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^tests/test_(pki_manager|redacting_filter)\.py$
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--config=pyproject.toml]
        files: ^(autonetarchitect|scripts|tests/ci|conftest\.py)/.*\.py$
      - id: ruff-format
        files: ^(autonetarchitect|scripts|tests/ci|conftest\.py)/.*\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy compatibility namespace
        entry: python -m mypy autonetarchitect/ --config-file mypy.ini
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: Bandit security scan
        entry: python -m bandit -r autonetarchitect/ -ll --skip B101
        language: system
        pass_filenames: false
        types: [python]
      - id: check-no-pass
        name: Check for pass statements
        entry: python scripts/check_no_pass.py
        language: system
        types: [python]
        exclude: ^tests/
      - id: check-no-todo
        name: Check maintenance markers
        entry: python scripts/check_todo.py
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
