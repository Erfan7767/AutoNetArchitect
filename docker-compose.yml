version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: ""
    image: autonetarchitect:0.1.0
    command: ["python", "-m", "uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - autonet_state:/var/lib/autonetarchitect
    environment:
      AUTONET_API_ROOT: /var/lib/autonetarchitect
      AUTONET_API_HOST: 0.0.0.0
      AUTONET_API_PORT: "8000"
      AUTONET_LOGGING_LEVEL: INFO
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: optional
    image: autonetarchitect:ui
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      AUTONET_API_URL: http://api:8000
      HOME: /tmp
      STREAMLIT_CONFIG_DIR: /tmp/.streamlit
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  autonet_state:
    name: autonetarchitect_state
